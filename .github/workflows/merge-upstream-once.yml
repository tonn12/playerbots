name: Merge Upstream PlayerBots Once

on:
  push:
    branches:
      - sync/upstream-2026-09-exec
    paths:
      - .github/workflows/merge-upstream-once.yml

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/upstream-2026-09-exec
          fetch-depth: 0

      - name: Merge official upstream while preserving our conflicting hunks
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cmangos/playerbots.git || true
          git fetch upstream master
          git merge --no-edit -X ours upstream/master

      - name: Bring in our quest herb fix
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin fix/quest-herb-gameobject
          if ! git merge-base --is-ancestor bc2c7347a0d74260b12df6c75322d48ebb16b185 HEAD; then
            git cherry-pick bc2c7347a0d74260b12df6c75322d48ebb16b185
          fi

      - name: Show resulting history
        shell: bash
        run: |
          git --no-pager log --oneline --decorate -20
          git status --short

      - name: Push merged result
        shell: bash
        run: git push origin HEAD:sync/upstream-2026-09-exec
