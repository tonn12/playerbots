# Windows-only Classic build for the quest herb GameObject fix.
name: Classic Windows Build

on:
  push:
    branches:
      - fix/quest-herb-gameobject
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classic-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BOOST_VERSION: "1.87.0"
  BOOST_PLATFORM_VERSION: "2022"
  BOOST_TOOLSET: "msvc"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout patched PlayerBots
        uses: actions/checkout@v4
        with:
          path: playerbots-src

      - name: Checkout customized CMaNGOS Classic core
        uses: actions/checkout@v4
        with:
          repository: tonn12/mangos-classic
          ref: diagnostics/travel-move-perf
          path: core

      - name: Install patched PlayerBots module into core tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "core/src/modules" | Out-Null
          if (Test-Path "core/src/modules/PlayerBots") {
            Remove-Item -Recurse -Force "core/src/modules/PlayerBots"
          }
          Copy-Item -Recurse -Force "playerbots-src" "core/src/modules/PlayerBots"
          if (Test-Path "core/src/modules/PlayerBots/.git") {
            Remove-Item -Recurse -Force "core/src/modules/PlayerBots/.git"
          }

      - name: Install Boost
        uses: MarkusJx/install-boost@v2.6.0
        id: install-boost
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          platform_version: ${{ env.BOOST_PLATFORM_VERSION }}
          toolset: ${{ env.BOOST_TOOLSET }}

      - name: Configure Classic with PlayerBots and AHBot
        shell: pwsh
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: |
          cmake -DBUILD_PLAYERBOTS=ON -DBUILD_AHBOT=ON -DBUILD_GIT_ID=ON -B build -S core

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package binaries
        shell: pwsh
        run: |
          7z a -tzip "classic-windows-build.zip" "build/bin/x64_Release/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: classic-windows-build
          path: classic-windows-build.zip
          if-no-files-found: error
